# Owned config - keybinds
# $mainMod = SUPER (see 00-vars.conf)

#### APPS ####
bindd = $mainMod, Return, Terminal, exec, $term
bindd = $mainMod, E, File manager, exec, $files
bindd = $mainMod, B, Browser, exec, xdg-open https://
bindd = $mainMod ALT, B, Toggle bar, exec, $noctalia bar-toggle
bindd = $mainMod SHIFT, B, Btop scratchpad, exec, $scriptsDir/BtopScratchpad.sh
bindd = $mainMod SHIFT, Return, Dropdown terminal, exec, $scriptsDir/Dropterminal.sh kitty

#### NOCTALIA ####
bindd = $mainMod, D, App launcher, exec, $noctalia panel-toggle launcher
bindd = $mainMod, S, Control center, exec, $noctalia panel-toggle control-center
bindd = $mainMod SHIFT, E, Noctalia settings, exec, $noctalia settings-toggle
bindd = ALT, Tab, Window switcher, exec, $noctalia window-switcher
bindd = $mainMod, W, Wallpaper picker, exec, $noctalia panel-toggle wallpaper
bindd = $mainMod SHIFT, W, Random wallpaper, exec, $noctalia wallpaper-random
bindd = $mainMod ALT, V, Clipboard history, exec, $noctalia panel-toggle clipboard
bindd = $mainMod, N, Night light toggle, exec, $noctalia nightlight-force-toggle
bindd = $mainMod SHIFT, N, Do not disturb, exec, $noctalia notification-dnd-toggle
bindd = $mainMod, T, Toggle theme mode, exec, $noctalia theme-mode-toggle
bindd = $mainMod ALT, E, Toggle edge window switch, exec, $scriptsDir/ToggleEdgeSwitch.sh

#### SYSTEM ####
bindd = CTRL ALT, L, Lock screen, exec, $noctalia session lock
bindd = CTRL ALT, P, Session menu, exec, $noctalia panel-toggle session
bindd = CTRL ALT, Delete, Exit Hyprland, exec, hyprctl dispatch exit
bindd = $mainMod, Q, Close window, killactive
bindd = $mainMod SHIFT, Q, Kill process, exec, $scriptsDir/KillActiveProcess.sh
bindd = $mainMod SHIFT, F, Fullscreen, fullscreen
bindd = $mainMod, F, Maximize/restore, exec, $scriptsDir/ToggleMaximize.sh
bindd = $mainMod, SPACE, Toggle floating, togglefloating
bindd = $mainMod ALT, SPACE, Toggle all floating, exec, hyprctl dispatch togglefloating

#### SCREENSHOTS / HARDWARE ####
bindd = $mainMod SHIFT, H, External monitor landscape, exec, hyprctl keyword monitor "HDMI-A-1,1920x1080@60,-1536x0,1.25,transform,0"
bindd = $mainMod, Print, Screenshot area, exec, env XDG_CURRENT_DESKTOP=sway flameshot gui
bindd = $mainMod SHIFT, Print, Screenshot full, exec, env XDG_CURRENT_DESKTOP=sway flameshot full -p $HOME/Imágenes/Screenshots
bindd = $mainMod SHIFT, S, Screenshot area, exec, env XDG_CURRENT_DESKTOP=sway flameshot gui
bindd = ALT SHIFT, S, Screenshot area, exec, env XDG_CURRENT_DESKTOP=sway flameshot gui
bindd = $mainMod CTRL, Print, Screenshot in 5s, exec, env XDG_CURRENT_DESKTOP=sway flameshot gui -d 5000
bindd = $mainMod CTRL SHIFT, Print, Screenshot in 10s, exec, env XDG_CURRENT_DESKTOP=sway flameshot gui -d 10000
bindd = ALT, Print, Screenshot active window, exec, env XDG_CURRENT_DESKTOP=sway flameshot screen -p $HOME/Imágenes/Screenshots
bindd = , F8, Fix audio ES8316, exec, $HOME/.local/bin/fix-audio.sh

#### LAYOUTS (apply to the current workspace) ####
bindd = $mainMod ALT, 1, Current workspace to dwindle, exec, $scriptsDir/SetWorkspaceLayout.sh dwindle
bindd = $mainMod ALT, 2, Current workspace to master, exec, $scriptsDir/SetWorkspaceLayout.sh master
bindd = $mainMod ALT, 3, Current workspace to scrolling, exec, $scriptsDir/SetWorkspaceLayout.sh scrolling
bindd = $mainMod ALT, 4, Current workspace to monocle, exec, $scriptsDir/SetWorkspaceLayout.sh monocle

# Floating window placement mode
bindd = $mainMod ALT, P, Enter placement mode, submap, placement
submap = placement
bindd = , C, Center floating window, exec, sh -c '$scriptsDir/WindowArrange.sh place center 1000 700; hyprctl dispatch submap reset'
bindd = , 1, Top-left floating window, exec, sh -c '$scriptsDir/WindowArrange.sh place top-left 900 600; hyprctl dispatch submap reset'
bindd = , 2, Top-right floating window, exec, sh -c '$scriptsDir/WindowArrange.sh place top-right 900 600; hyprctl dispatch submap reset'
bindd = , 3, Bottom-left floating window, exec, sh -c '$scriptsDir/WindowArrange.sh place bottom-left 900 600; hyprctl dispatch submap reset'
bindd = , 4, Bottom-right floating window, exec, sh -c '$scriptsDir/WindowArrange.sh place bottom-right 900 600; hyprctl dispatch submap reset'
bindd = , F, Make floating without moving, exec, sh -c '$scriptsDir/WindowArrange.sh float; hyprctl dispatch submap reset'
bindd = , escape, Exit placement mode, submap, reset
submap = reset

# Dwindle
bindd = $mainMod, P, Toggle pseudo, pseudo,
bindd = $mainMod SHIFT, I, Toggle split, layoutmsg, togglesplit

# Master
bindd = $mainMod, I, Add master, layoutmsg, addmaster
bindd = $mainMod CTRL, D, Remove master, layoutmsg, removemaster
bindd = $mainMod CTRL, Return, Swap with master, layoutmsg, swapwithmaster

# Scrolling
bindd = $mainMod SHIFT, period, Move to right column, layoutmsg, move +col
bindd = $mainMod SHIFT, comma, Move to left column, layoutmsg, move -col
bindd = $mainMod ALT, comma, Swap columns left, layoutmsg, swapcol l
bindd = $mainMod ALT, period, Swap columns right, layoutmsg, swapcol r
bindd = $mainMod CTRL, I, Stack into previous column, layoutmsg, consume
bindd = $mainMod CTRL SHIFT, I, Expel to own column, layoutmsg, expel
bindd = $mainMod ALT, H, Scroll direction right, exec, hyprctl keyword scrolling:direction right
bindd = $mainMod ALT, J, Scroll direction down, exec, hyprctl keyword scrolling:direction down

#### GROUPS ####
bindd = $mainMod, G, Toggle group, togglegroup
bindd = $mainMod CTRL, Tab, Change group member, changegroupactive
bindd = $mainMod CTRL, K, Move into group left, moveintogroup, l
bindd = $mainMod CTRL, L, Move into group right, moveintogroup, r
bindd = $mainMod CTRL, H, Move out of group, moveoutofgroup

#### FOCUS / MOVE / RESIZE ####
bindd = $mainMod, left, Focus left, movefocus, l
bindd = $mainMod, right, Focus right, movefocus, r
bindd = $mainMod, up, Focus up, movefocus, u
bindd = $mainMod, down, Focus down, movefocus, d
bindd = $mainMod, j, Cycle next, cyclenext
bindd = $mainMod, k, Cycle previous, cyclenext, prev

bindd = $mainMod SHIFT, left, Resize left, resizeactive, -50 0
bindd = $mainMod SHIFT, right, Resize right, resizeactive, 50 0
bindd = $mainMod SHIFT, up, Resize up, resizeactive, 0 -50
bindd = $mainMod SHIFT, down, Resize down, resizeactive, 0 50

bindd = $mainMod CTRL, left, Move window left, movewindow, l
bindd = $mainMod CTRL, right, Move window right, movewindow, r
bindd = $mainMod CTRL, up, Move window up, movewindow, u
bindd = $mainMod CTRL, down, Move window down, movewindow, d

bindd = $mainMod ALT, left, Swap window left, swapwindow, l
bindd = $mainMod ALT, right, Swap window right, swapwindow, r
bindd = $mainMod ALT, up, Swap window up, swapwindow, u
bindd = $mainMod ALT, down, Swap window down, swapwindow, d

bindmd = $mainMod, mouse:272, Move window, movewindow
bindmd = $mainMod, mouse:273, Resize window, resizewindow
bindd = $mainMod, mouse:275, Previous workspace, workspace, e-1
bindd = $mainMod, mouse:276, Next workspace, workspace, e+1

#### WORKSPACES ####
bindd = $mainMod, code:10, Workspace 1, workspace, 1
bindd = $mainMod, code:11, Workspace 2, workspace, 2
bindd = $mainMod, code:12, Workspace 3, workspace, 3
bindd = $mainMod, code:13, Workspace 4, workspace, 4
bindd = $mainMod, code:14, Workspace 5, workspace, 5
bindd = $mainMod, code:15, Workspace 6, workspace, 6
bindd = $mainMod, code:16, Workspace 7, workspace, 7
bindd = $mainMod, code:17, Workspace 8, workspace, 8
bindd = $mainMod, code:18, Workspace 9, workspace, 9
bindd = $mainMod, code:19, Workspace 10, workspace, 10

bindd = $mainMod SHIFT, code:10, Move to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, code:11, Move to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, code:12, Move to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, code:13, Move to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, code:14, Move to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, code:15, Move to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, code:16, Move to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, code:17, Move to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, code:18, Move to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, code:19, Move to workspace 10, movetoworkspace, 10

bindd = $mainMod CTRL, code:10, Move silently to workspace 1, movetoworkspacesilent, 1
bindd = $mainMod CTRL, code:11, Move silently to workspace 2, movetoworkspacesilent, 2
bindd = $mainMod CTRL, code:12, Move silently to workspace 3, movetoworkspacesilent, 3
bindd = $mainMod CTRL, code:13, Move silently to workspace 4, movetoworkspacesilent, 4
bindd = $mainMod CTRL, code:14, Move silently to workspace 5, movetoworkspacesilent, 5
bindd = $mainMod CTRL, code:15, Move silently to workspace 6, movetoworkspacesilent, 6
bindd = $mainMod CTRL, code:16, Move silently to workspace 7, movetoworkspacesilent, 7
bindd = $mainMod CTRL, code:17, Move silently to workspace 8, movetoworkspacesilent, 8
bindd = $mainMod CTRL, code:18, Move silently to workspace 9, movetoworkspacesilent, 9
bindd = $mainMod CTRL, code:19, Move silently to workspace 10, movetoworkspacesilent, 10

bindd = $mainMod, Tab, Next workspace, workspace, m+1
bindd = $mainMod SHIFT, Tab, Previous workspace, workspace, m-1
bindd = $mainMod, comma, Previous workspace, workspace, e-1
bindd = $mainMod, period, Next workspace, workspace, e+1
bindd = $mainMod, mouse_down, Next app, cyclenext
bindd = $mainMod, mouse_up, Previous app, cyclenext, prev

bindd = $mainMod, U, Toggle stash workspace, togglespecialworkspace, stash
bindd = $mainMod SHIFT, U, Move to stash workspace, movetoworkspace, special:stash
bindd = $mainMod CTRL, U, Move from special workspace, exec, $scriptsDir/MoveFromScratchpad.sh

#### MEDIA / HARDWARE KEYS ####
bindld = , XF86AudioRaiseVolume, Volume up, exec, $noctalia volume-up
bindld = , XF86AudioLowerVolume, Volume down, exec, $noctalia volume-down
bindld = , XF86AudioMute, Toggle mute, exec, $noctalia volume-mute
bindld = , XF86AudioMicMute, Toggle mic mute, exec, $noctalia mic-mute
bindld = , XF86MonBrightnessUp, Brightness up, exec, $noctalia brightness-up
bindld = , XF86MonBrightnessDown, Brightness down, exec, $noctalia brightness-down
bindld = , XF86AudioPlay, Play/pause, exec, $noctalia media toggle
bindld = , XF86AudioPause, Play/pause, exec, $noctalia media toggle
bindld = , XF86AudioNext, Next track, exec, $noctalia media next
bindld = , XF86AudioPrev, Previous track, exec, $noctalia media previous
bindld = , XF86AudioStop, Stop, exec, $noctalia media stop
bindld = , XF86Sleep, Lock and suspend, exec, $noctalia session lock-and-suspend
bindld = , XF86Rfkill, Toggle wifi, exec, $noctalia wifi-toggle
