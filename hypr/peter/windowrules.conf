# Owned config - window rules

# Flameshot overlay: keep it floating, pinned and at the origin (fractional scaling fix)
windowrule {
    name = flameshot
    match:class = (?i)flameshot
    float = on
    pin = on
    move = 0 0
}

# Noctalia settings window
windowrule {
    name = noctalia-settings
    match:class = ^(dev\.noctalia\.Noctalia)$
    float = on
    size = 1080 920
}
