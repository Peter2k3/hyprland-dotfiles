# Owned config - startup
# Noctalia is the shell: bar, launcher, notifications, OSD, lock, wallpaper,
# clipboard, control center and its own polkit agent.

exec-once = noctalia --daemon

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = $scriptsDir/PortalHyprland.sh

exec-once = sh -c 'sleep 0.3; hyprctl setcursor "${HYPRCURSOR_THEME:-Bibata-Modern-Ice}" "${HYPRCURSOR_SIZE:-24}"'

# Flameshot daemon (screenshots)
exec-once = env XDG_CURRENT_DESKTOP=sway flameshot

# Dropdown terminal
exec-once = $scriptsDir/Dropterminal.sh --startup kitty

# Switch windows by touching the left/right screen edge
exec-once = $scriptsDir/EdgeWindowSwitch.sh
