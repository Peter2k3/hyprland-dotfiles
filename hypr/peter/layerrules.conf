# Owned config - layer rules
# Noctalia owns its own animations; let Hyprland blur its surfaces.

layerrule = match:namespace ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$, no_anim on, ignore_alpha 0.5, blur on, blur_popups on

# Flameshot overlay
layerrule = match:namespace (.*)flameshot(.*), blur on, ignore_alpha 0
