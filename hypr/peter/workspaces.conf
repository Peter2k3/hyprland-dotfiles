# Owned config - workspace rules
# Persistent workspaces keep empty workspaces visible in the Noctalia workspace widget.
# Layouts are interleaved starting with scrolling on workspace 1.

workspace = 1, monitor:eDP-1, persistent:true, defaultName:web, layout:scrolling
workspace = 2, monitor:eDP-1, persistent:true, defaultName:code, layout:dwindle
workspace = 3, monitor:eDP-1, persistent:true, defaultName:term, layout:scrolling
workspace = 4, monitor:eDP-1, persistent:true, defaultName:docs, layout:dwindle
workspace = 5, monitor:eDP-1, persistent:true, defaultName:misc, layout:scrolling
workspace = 6, monitor:eDP-1, persistent:true, defaultName:six, layout:dwindle
workspace = 7, monitor:HDMI-A-1, persistent:true, defaultName:seven, layout:scrolling
workspace = 8, monitor:HDMI-A-1, persistent:true, defaultName:eight, layout:dwindle
workspace = 9, monitor:HDMI-A-1, persistent:true, defaultName:nine, layout:scrolling
workspace = 10, monitor:HDMI-A-1, persistent:true, defaultName:ten, layout:dwindle
