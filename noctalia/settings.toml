config_version = 14

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "clock_main@eDP-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."clock_main@eDP-1"]
    box_height = 110.0
    box_width = 520.0
    cx = 768.0
    cy = 170.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget."clock_main@eDP-1".settings]
        format = "{:%H:%M}"

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 432.00003051757812
    cy = 1018.3112182617188
    output = "HDMI-A-1"
    placement_height = 1536.0
    placement_width = 864.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 82.0
    box_width = 720.0
    cx = 768.0
    cy = 432.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.81999999999999995
        background_radius = 24.0
        center_password_text = false
        input_opacity = 0.90000000000000002
        input_radius = 12.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_session_buttons = false
        show_unlock_hint = false
        show_weather = false

[shell]
telemetry_enabled = true

[theme]
builtin = "Dracula"
community_palette = "Catppuccin Macchiato Green"
mode = "light"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/peter/Imágenes/wallpapers"

    [wallpaper.default]
    path = "/home/peter/Imágenes/wallpapers/Relaxed_Mario.png"

    [wallpaper.last]
    path = "/home/peter/Imágenes/wallpapers/Relaxed_Mario.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/peter/Imágenes/wallpapers/Relaxed_Mario.png"